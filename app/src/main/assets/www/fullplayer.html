<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>播放</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#fff;overflow:hidden;width:100vw;height:100dvh;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#player{position:fixed;inset:0}
#player.portrait{display:flex;flex-direction:column}
#player.portrait #varea{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#player.portrait #ctrls{position:relative;flex-shrink:0;width:100%;background:rgba(0,0,0,.92);padding:8px 12px max(env(safe-area-inset-bottom,8px),8px);left:auto;bottom:auto;top:auto}
#varea{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#bmask{position:absolute;inset:0;pointer-events:none;z-index:2;background:rgba(0,0,0,0)}
#ctrls{position:absolute;background:rgba(0,0,0,.92);padding:8px 12px max(env(safe-area-inset-bottom,8px),8px);z-index:15;transition:opacity .3s}
#ctrls.hidden{opacity:0;pointer-events:none}
#prog-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.prog-t{font-size:12px;color:#ccc;min-width:42px;text-align:center}
#prog-track{flex:1;height:20px;position:relative;display:flex;align-items:center;touch-action:none}
#prog-inner{position:relative;width:100%;height:4px;background:rgba(255,255,255,.18);border-radius:2px}
#prog-buf{position:absolute;top:0;left:0;height:100%;background:rgba(255,255,255,.15);border-radius:2px}
#prog-fill{position:absolute;top:0;left:0;height:100%;background:#fb7299;border-radius:2px}
#prog-dot{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:18px;height:18px;background:#fb7299;border-radius:50%;border:3px solid #fff;z-index:1;transition:transform .15s,width .15s,height .15s}
#prog-dot.active{transform:translate(-50%,-50%) scale(1.6);width:22px;height:22px}
#btm-row{display:flex;align-items:center;gap:4px}
#btn-pp{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px 4px 0}
#btm-row .sp{flex:1}
#btn-fs{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 0 4px 8px}
.top-btn{position:fixed;top:max(env(safe-area-inset-top,8px),8px);z-index:20;width:36px;height:36px;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:18px;cursor:pointer;transition:opacity .3s}
.top-btn.hidden{opacity:0;pointer-events:none}
#back-btn{left:8px}
#lock-btn{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:20;width:48px;height:48px;border:none;border-radius:0 12px 12px 0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:22px;cursor:pointer;transition:opacity .3s;padding:0}
#lock-btn.hidden{opacity:0;pointer-events:none}
.float-hud{position:fixed;display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(0,0,0,.75);border-radius:14px;padding:14px 10px;z-index:25;pointer-events:none;opacity:0;transition:opacity .15s}
.float-hud.on{opacity:1}
.float-hud .hud-icon{font-size:22px}
.float-hud .hud-track{width:4px;height:80px;background:rgba(255,255,255,.2);border-radius:2px;position:relative}
.float-hud .hud-fill{position:absolute;bottom:0;width:100%;background:#fb7299;border-radius:2px}
.float-hud .hud-label{font-size:11px;color:#ccc}
#hud-vol{top:50%;right:24px;transform:translateY(-50%)}
#hud-bri{top:50%;left:24px;transform:translateY(-50%)}
.center-tip{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:8px 18px;border-radius:8px;font-size:15px;font-weight:600;z-index:25;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap}
.center-tip.on{opacity:1}
#seek-pv{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;z-index:25;pointer-events:none;opacity:0;display:flex;align-items:baseline;gap:2px}
#seek-pv.on{opacity:1}
#seek-pv .cur{font-size:28px;font-weight:600}
#seek-pv .sep{font-size:14px;opacity:.7;margin:0 3px}
#seek-pv .total{font-size:14px;opacity:.7}
</style>
</head>
<body>
<div id="player">
  <div id="varea">
    <video id="v" playsinline webkit-playsinline></video>
    <div id="bmask"></div>
  </div>
  <div id="ctrls">
    <div id="prog-row">
      <span class="prog-t" id="tcur">00:00</span>
      <div id="prog-track"><div id="prog-inner">
        <div id="prog-buf"></div><div id="prog-fill"></div><div id="prog-dot"></div>
      </div></div>
      <span class="prog-t" id="ttot">00:00</span>
    </div>
    <div id="btm-row">
      <button id="btn-pp">▶</button><div class="sp"></div><button id="btn-fs">⛶</button>
    </div>
  </div>
  <button id="back-btn" class="top-btn">&larr;</button>
  <button id="lock-btn">🔓</button>
  <div class="center-tip" id="tip-speed"></div>
  <div class="center-tip" id="tip-lock"></div>
  <div id="seek-pv"><span class="cur">00:00</span><span class="sep">/</span><span class="total">00:00</span></div>
  <div class="float-hud" id="hud-vol"><span class="hud-icon">🔊</span><div class="hud-track"><div class="hud-fill"></div></div><span class="hud-label"></span></div>
  <div class="float-hud" id="hud-bri"><span class="hud-icon">☀</span><div class="hud-track"><div class="hud-fill"></div></div><span class="hud-label"></span></div>
</div>
<script>
(function(){
const $=s=>document.querySelector(s);
const player=$('#player'), v=$('#v'), varea=$('#varea'), bmask=$('#bmask'), ctrls=$('#ctrls');
const pBuf=$('#prog-buf'), pFill=$('#prog-fill'), pDot=$('#prog-dot');
const tCur=$('#tcur'), tTot=$('#ttot');
const btnPP=$('#btn-pp'), btnFS=$('#btn-fs'), btnLock=$('#lock-btn'), btnBack=$('#back-btn');
const tipSpeed=$('#tip-speed'), tipLock=$('#tip-lock'), seekPv=$('#seek-pv');
const hudVol=$('#hud-vol'), hudBri=$('#hud-bri');
const progTrack=$('#prog-track');

let bri=0, locked=false, prevVol=1;
let vBounds={top:0,bottom:window.innerHeight};
let dragP=false;
let gType=null, lpFired=false, lpTimer=null, tapTimer=null;
let ts={x:0,y:0,lx:0,ly:0,vol:0,bri:0,time:0,seekT:0,lastTap:0};

function updateVBounds(){
  const r=varea.getBoundingClientRect();
  if(v.videoWidth&&v.videoHeight){
    const vr=v.videoWidth/v.videoHeight, pr=r.width/Math.max(1,r.height);
    let vw,vh,vl,vt;
    if(vr>pr){vw=r.width;vh=r.width/vr;vl=r.left;vt=r.top+(r.height-vh)/2}
    else{vh=r.height;vw=r.height*vr;vt=r.top;vl=r.left+(r.width-vw)/2}
    vBounds={left:vl,top:vt,right:vl+vw,bottom:vt+vh,width:vw,height:vh};
  }else{vBounds={left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}}
  if(!player.classList.contains('portrait')){
    ctrls.style.bottom=(window.innerHeight-vBounds.bottom)+'px';
    ctrls.style.left=vBounds.left+'px';
    ctrls.style.width=vBounds.width+'px';
  }
}
window.addEventListener('resize',()=>{updateVBounds();syncLayout()});
updateVBounds();syncLayout();

function syncLayout(){
  const fs=!!document.fullscreenElement;
  const landscape=window.innerWidth>window.innerHeight;
  if(!fs&&!landscape)player.classList.add('portrait');
  else player.classList.remove('portrait');
}
document.addEventListener('fullscreenchange',syncLayout);

const fm=s=>{if(!s||!isFinite(s))return'00:00';return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};
const showTip=(el,txt,dur=1200)=>{el.textContent=txt;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),dur)};

// Load video URL from query param
const params=new URLSearchParams(location.search);
const url=params.get('url')||'';
if(url){v.src=url;v.play().catch(()=>{})}

v.onerror=()=>{
  v.style.display='none';
  var err=document.createElement('div');
  err.textContent='视频加载失败';
  err.style.cssText='position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#aaa;font-size:16px';
  document.body.appendChild(err);
};
v.onloadedmetadata=()=>{tTot.textContent=fm(v.duration);updateVBounds();v.play().catch(()=>{})};
v.onloadeddata=updateVBounds;
v.ondurationchange=()=>{tTot.textContent=fm(v.duration)};
v.ontimeupdate=()=>{
  if(dragP)return;
  const p=v.duration?(v.currentTime/v.duration)*100:0;
  pFill.style.width=p+'%';pDot.style.left=p+'%';tCur.textContent=fm(v.currentTime);
};
v.onprogress=()=>{const n=v.buffered.length;if(n)pBuf.style.width=v.duration?(v.buffered.end(n-1)/v.duration)*100+'%':'0%'};
v.onplaying=()=>{btnPP.textContent='⏸'};
v.onpause=()=>{btnPP.textContent='▶'};
v.onended=()=>{btnPP.textContent='🔄'};
v.onclick=e=>e.stopPropagation();
v.oncontextmenu=e=>e.preventDefault();

function tp(){v.paused?v.play().catch(()=>{}):v.pause()}

// Control bar auto-hide
let hideTimer;
function wakeCtrls(){if(document.fullscreenElement)return;ctrls.classList.remove('hidden');clearTimeout(hideTimer);if(!v.paused&&!locked)hideTimer=setTimeout(()=>ctrls.classList.add('hidden'),3000)}
function quickCtrls(){if(document.fullscreenElement)return;ctrls.classList.remove('hidden');clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(!v.paused&&!locked)ctrls.classList.add('hidden')},2000)}
function toggleFsControls(){if(!document.fullscreenElement)return;const h=ctrls.classList.contains('hidden');if(h){ctrls.classList.remove('hidden');btnBack.classList.remove('hidden');btnLock.classList.remove('hidden')}else{ctrls.classList.add('hidden');btnBack.classList.add('hidden');btnLock.classList.add('hidden')}}
varea.addEventListener('touchstart',wakeCtrls);
wakeCtrls();

btnPP.onclick=e=>{e.stopPropagation();tp()};
btnFS.onclick=async e=>{
  e.stopPropagation();
  if(document.fullscreenElement){await document.exitFullscreen();screen.orientation?.unlock()}
  else{try{await document.documentElement.requestFullscreen();screen.orientation?.lock('landscape').catch(()=>{})}catch(_){}}
};
btnBack.onclick=e=>{e.stopPropagation();if(document.fullscreenElement)document.exitFullscreen();history.back()};
document.addEventListener('fullscreenchange',()=>{
  syncLayout();updateVBounds();
  if(!document.fullscreenElement){screen.orientation?.unlock();ctrls.classList.remove('hidden');btnBack.classList.remove('hidden');btnLock.classList.remove('hidden')}
  else{ctrls.classList.remove('hidden');btnBack.classList.remove('hidden');btnLock.classList.remove('hidden')}
});

// Lock
let lockHideTimer;
function showLockBtn(){btnLock.classList.remove('hidden');clearTimeout(lockHideTimer);if(locked)lockHideTimer=setTimeout(()=>btnLock.classList.add('hidden'),2000)}
function setLock(on){
  locked=on;btnLock.textContent=on?'🔒':'🔓';
  if(on){ctrls.classList.add('hidden');btnBack.classList.add('hidden');btnLock.classList.remove('hidden');lockHideTimer=setTimeout(()=>btnLock.classList.add('hidden'),2000)}
  else{ctrls.classList.remove('hidden');btnBack.classList.remove('hidden');btnLock.classList.remove('hidden');clearTimeout(lockHideTimer)}
}
btnLock.onclick=e=>{e.stopPropagation();setLock(!locked)};
player.addEventListener('touchstart',e=>{if(locked&&e.target!==btnLock&&!btnLock.contains(e.target)){showLockBtn();e.stopPropagation();e.preventDefault()}},true);

// Progress bar drag
function innerW(){return $('#prog-inner').getBoundingClientRect().width}
function setProgPx(px){
  const w=innerW(), p=Math.max(0,Math.min(1,px/w));
  v.currentTime=p*v.duration;
  pFill.style.width=(p*100)+'%'; pDot.style.left=Math.round(px)+'px'; tCur.textContent=fm(p*v.duration);
}
progTrack.addEventListener('pointerdown',e=>{
  if(locked)return;
  e.stopPropagation();e.preventDefault(); dragP=true;
  progTrack.setPointerCapture(e.pointerId); pDot.classList.add('active');
  const r=$('#prog-inner').getBoundingClientRect();
  setProgPx(e.clientX-r.left);
  seekPv.querySelector('.cur').textContent=fm(v.currentTime);
  seekPv.querySelector('.total').textContent=fm(v.duration);
  seekPv.classList.add('on');
});
document.addEventListener('pointermove',e=>{
  if(!dragP||locked)return;
  const r=$('#prog-inner').getBoundingClientRect();
  setProgPx(e.clientX-r.left);
  seekPv.querySelector('.cur').textContent=fm(v.currentTime);
});
document.addEventListener('pointerup',()=>{
  if(!dragP)return; dragP=false; pDot.classList.remove('active'); seekPv.classList.remove('on');
  const pc=v.duration?(v.currentTime/v.duration)*100:0;
  pDot.style.left=pc+'%';pFill.style.width=pc+'%'; wakeCtrls();
});
progTrack.addEventListener('lostpointercapture',()=>{
  if(!dragP)return; dragP=false; pDot.classList.remove('active'); seekPv.classList.remove('on');
  const pc=v.duration?(v.currentTime/v.duration)*100:0;
  pDot.style.left=pc+'%';pFill.style.width=pc+'%';
});

// Volume/Brightness HUD
function updateVolHud(){
  const vp=Math.round(v.volume*100);
  hudVol.querySelector('.hud-icon').textContent=v.volume===0?'\ud83d\udd07':v.volume<.5?'\ud83d\udd09':'\ud83d\udd0a';
  hudVol.querySelector('.hud-fill').style.height=vp+'%';hudVol.querySelector('.hud-label').textContent=vp+'%';
}
function showVolHud(){hudVol.classList.add('on');clearTimeout(hudVol._t);hudVol._t=setTimeout(()=>hudVol.classList.remove('on'),800)}
function updateBriHud(){
  const bp=Math.round((1-bri)*100);
  hudBri.querySelector('.hud-fill').style.height=bp+'%';hudBri.querySelector('.hud-label').textContent=bp+'%';
}
function showBriHud(){hudBri.classList.add('on');clearTimeout(hudBri._t);hudBri._t=setTimeout(()=>hudBri.classList.remove('on'),800)}
updateVolHud();

hudVol.addEventListener('click',e=>{
  e.stopPropagation();
  v.volume=v.volume>0?(prevVol=v.volume,0):(prevVol||0.5);
  updateVolHud();showVolHud();
});

// ===== Gestures =====
const zone=x=>x<window.innerWidth*.25?'bri':x>window.innerWidth*.75?'vol':'seek';
player.addEventListener('touchstart',e=>{
  if(dragP||e.target.closest('#prog-track')){ts.lastTap=0;return}
  if(e.touches.length!==1)return;
  const t=e.touches[0];
  ts.x=t.clientX;ts.y=t.clientY;ts.lx=t.clientX;ts.ly=t.clientY;
  ts.vol=v.volume;ts.bri=bri;ts.time=v.currentTime;ts.seekT=0;
  gType=null;lpFired=false;
  updateVBounds();quickCtrls();
  clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{if(!gType){lpFired=true;v.playbackRate=2;tipSpeed.textContent='2x \u5feb\u653e\u4e2d';tipSpeed.classList.add('on')}},500);
},{passive:false});

player.addEventListener('touchmove',e=>{
  if(dragP||e.touches.length!==1||locked)return;
  const t=e.touches[0];
  const ddx=t.clientX-ts.lx, ddy=t.clientY-ts.ly;
  const tdx=t.clientX-ts.x, tdy=t.clientY-ts.y;
  const atdx=Math.abs(tdx), atdy=Math.abs(tdy);
  if(!gType){
    if(atdx>atdy&&atdx>10)gType='seek';
    else if(atdy>atdx&&atdy>10){const z=zone(ts.x);gType=(z==='bri'||z==='vol')?z:null}
    if(gType==='seek'&&lpFired)clearTimeout(lpTimer);
    if((gType==='bri'||gType==='vol')&&lpFired){v.playbackRate=1;tipSpeed.classList.remove('on');lpFired=false}
  }
  if(!gType&&!lpFired)return;
  e.preventDefault(); ts.lx=t.clientX;ts.ly=t.clientY;
  if(gType==='seek'){
    ts.seekT+=ddx*0.15;
    const to=Math.max(0,Math.min(v.duration,ts.time+ts.seekT));
    seekPv.querySelector('.cur').textContent=fm(to);
    seekPv.querySelector('.total').textContent=fm(v.duration);
    seekPv.classList.add('on');
    pFill.style.width=(to/v.duration*100)+'%';pDot.style.left=(to/v.duration*100)+'%';
  }
  if(gType==='bri'){
    const rH=Math.max(vBounds.height,200);
    bri=Math.max(0,Math.min(1,ts.bri+tdy/(rH*.5)));
    bmask.style.background='rgba(0,0,0,'+bri.toFixed(3)+')';
    updateBriHud();showBriHud();
  }
  if(gType==='vol'){
    const rH=Math.max(vBounds.height,200);
    v.volume=Math.max(0,Math.min(1,ts.vol-tdy/(rH*.5)));
    updateVolHud();showVolHud();
  }
},{passive:false});

player.addEventListener('touchend',()=>{
  clearTimeout(lpTimer);
  if(lpFired){v.playbackRate=1;tipSpeed.classList.remove('on');lpFired=false}
  if(gType==='seek'){v.currentTime=Math.max(0,Math.min(v.duration,ts.time+ts.seekT));seekPv.classList.remove('on')}
  if(gType==='bri'){clearTimeout(hudBri._t);hudBri._t=setTimeout(()=>hudBri.classList.remove('on'),600)}
  if(gType==='vol'){clearTimeout(hudVol._t);hudVol._t=setTimeout(()=>hudVol.classList.remove('on'),600)}
  const had=gType||lpFired;gType=null;
  if(had||locked)return;
  const now=Date.now();
  if(now-ts.lastTap<280){clearTimeout(tapTimer);tp();ts.lastTap=0}
  else if(document.fullscreenElement){ts.lastTap=now;toggleFsControls();tapTimer=setTimeout(()=>{ts.lastTap=0},280)}
  else{ts.lastTap=now;tapTimer=setTimeout(()=>{ts.lastTap=0;wakeCtrls()},280)}
});
player.addEventListener('touchcancel',()=>{
  clearTimeout(lpTimer);
  if(lpFired){v.playbackRate=1;tipSpeed.classList.remove('on')}
  if(gType==='seek')v.currentTime=Math.max(0,Math.min(v.duration,ts.time+ts.seekT));
  seekPv.classList.remove('on');hudVol.classList.remove('on');hudBri.classList.remove('on');
  gType=null;lpFired=false;
});

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.target!==document.body&&e.target!==document.documentElement)return;
  switch(e.key){
    case' ':e.preventDefault();tp();break;
    case'ArrowLeft':v.currentTime=Math.max(0,v.currentTime-5);showTip(tipSpeed,fm(v.currentTime)+' / '+fm(v.duration));break;
    case'ArrowRight':v.currentTime=Math.min(v.duration,v.currentTime+5);showTip(tipSpeed,fm(v.currentTime)+' / '+fm(v.duration));break;
    case'ArrowUp':e.preventDefault();v.volume=Math.min(1,v.volume+.05);updateVolHud();showVolHud();break;
    case'ArrowDown':e.preventDefault();v.volume=Math.max(0,v.volume-.05);updateVolHud();showVolHud();break;
    case'm':e.preventDefault();v.muted=!v.muted;updateVolHud();showVolHud();break;
  }
});
})();
</script>
</body>
</html>
